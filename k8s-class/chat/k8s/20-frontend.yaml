# Cross-namespace backend address for the nginx proxy
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: chat-frontend
data:
  BACKEND_URL: "http://chat-backend-svc.chat-backend.svc.cluster.local:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  namespace: chat-frontend
  labels:
    app: chat-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-frontend
  template:
    metadata:
      labels:
        app: chat-frontend
    spec:
      containers:
        - name: chat-frontend
          image: srinudev645/chat-me-frontend:v1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend-svc
  namespace: chat-frontend
spec:
  type: NodePort
  selector:
    app: chat-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080   # open this port in the worker nodes' security group
