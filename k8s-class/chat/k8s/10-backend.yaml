# Non-secret config
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: chat-backend
data:
  PORT: "5000"
  NODE_ENV: "production"
  GEMINI_MODEL: "gemini-2.5-flash"
---
# Create the secret BEFORE applying (never commit the real key):
#   kubectl create secret generic gemini-secret -n chat-backend \
#     --from-literal=GEMINI_API_KEY=YOUR_REAL_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: chat-backend
  labels:
    app: chat-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
    spec:
      containers:
        - name: chat-backend
          image: srinudev645/chat-me-backend:v1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: gemini-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend-svc
  namespace: chat-backend
spec:
  selector:
    app: chat-backend
  ports:
    - port: 5000
      targetPort: 5000
