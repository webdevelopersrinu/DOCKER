# Declarative Secret — put your real key in stringData before applying,
# and do NOT commit this file with the real value (add it to .gitignore).
# stringData takes plain text; Kubernetes base64-encodes it into .data for you.
apiVersion: v1
kind: Secret
metadata:
  name: gemini-secret
  namespace: chat-backend
type: Opaque
stringData:
  GEMINI_API_KEY: "PASTE_YOUR_REAL_KEY_HERE"
