server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (react-router) handles the rest.
    # API calls are NOT proxied here: the Ingress routes /api/v1/* straight to
    # the backend services in the other namespace, so the browser hits one
    # external host for both static assets and the API.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
