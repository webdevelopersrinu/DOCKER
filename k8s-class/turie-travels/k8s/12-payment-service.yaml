# Not referenced by the Ingress (40-ingress.yaml) — payment-service is called
# ONLY by booking-service, internally. See 30-networkpolicy-backend.yaml, which
# locks its ingress down to booking-service pods only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: turie-backend
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: srinudev645/turie-travels-payment:v1
          ports:
            - containerPort: 5004
          env:
            - name: PORT
              value: "5004"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb://mongo.mongo-db.svc.cluster.local:27017/paymentdb"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: turie-backend
spec:
  selector:
    app: payment-service
  ports:
    - port: 5004
      targetPort: 5004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: turie-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
