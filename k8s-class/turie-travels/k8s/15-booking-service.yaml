# Orchestrator — calls catalog-service, payment-service, notification-service
# over their in-cluster Service DNS (same namespace, so short names resolve).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: turie-backend
  labels:
    app: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: srinudev645/turie-travels-booking:v1
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb://mongo.mongo-db.svc.cluster.local:27017/bookingdb"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:5002"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:5004"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:5006"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: turie-backend
spec:
  selector:
    app: booking-service
  ports:
    - port: 5003
      targetPort: 5003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service
  namespace: turie-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
