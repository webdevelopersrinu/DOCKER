apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: turie-backend
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: srinudev645/turie-travels-notification:v1
          ports:
            - containerPort: 5006
          env:
            - name: PORT
              value: "5006"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb://mongo.mongo-db.svc.cluster.local:27017/notificationdb"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: turie-backend
spec:
  selector:
    app: notification-service
  ports:
    - port: 5006
      targetPort: 5006
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  namespace: turie-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
