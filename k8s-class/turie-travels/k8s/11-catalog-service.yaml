apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: turie-backend
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: srinudev645/turie-travels-catalog:v1
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb://mongo.mongo-db.svc.cluster.local:27017/catalogdb"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: turie-backend
spec:
  selector:
    app: catalog-service
  ports:
    - port: 5002
      targetPort: 5002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service
  namespace: turie-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Run once after the Deployment above is ready, to load place/trip data:
#   kubectl apply -f 11-catalog-service.yaml
#   kubectl wait --for=condition=ready pod -l app=catalog-service -n turie-backend
#   kubectl create job catalog-seed-$(date +%s) -n turie-backend --from=cronjob/catalog-seed 2>/dev/null || true
# (simpler: just exec the seed script in a running pod — see k8s/README.md)
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-seed
  namespace: turie-backend
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: catalog-seed
          image: srinudev645/turie-travels-catalog:v1
          command: ["node", "src/seed/seed.js"]
          env:
            - name: MONGO_URI
              value: "mongodb://mongo.mongo-db.svc.cluster.local:27017/catalogdb"
