# Shared JWT signing secret — must be the SAME value across auth-service,
# booking-service and profile-service (they all verify tokens auth-service issues).
# Put a real random value in stringData before applying, and do NOT commit this
# file with the real value filled in (add it to .gitignore, same as 05-secret.yaml
# in chat/k8s).
#
# Generate one with: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: turie-backend
type: Opaque
stringData:
  JWT_SECRET: "PASTE_A_REAL_RANDOM_SECRET_HERE"
