apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: turie-backend
  labels:
    app: profile-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
        - name: profile-service
          image: srinudev645/turie-travels-profile:v1
          ports:
            - containerPort: 5005
          env:
            - name: PORT
              value: "5005"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb://mongo.mongo-db.svc.cluster.local:27017/profiledb"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: turie-backend
spec:
  selector:
    app: profile-service
  ports:
    - port: 5005
      targetPort: 5005
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: profile-service
  namespace: turie-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: profile-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
